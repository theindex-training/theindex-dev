# Development only (docker-compose.dev.yml, profiles "front" and "full"): the front image's own
# nginx serves the app's files and nothing else, because in production Traefik sends /api to the
# API container. Here this config takes its place and does that job itself.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads: article images (up to 15 MB) and lesson-plan PDFs (up to 10 MB).
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
