services:
  traefik:
    image: traefik:v3.6.1
    command:
      - --api.dashboard=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=antoncholakov14@gmail.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    labels:
      - traefik.enable=true

      # Global middlewares (defined once)
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.regex=^https?://www\.(.+)
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.permanent=true

      # Catch-all for www -> apex (works for both http and https)
      - traefik.http.routers.www-http.rule=Host(`www.theindex.training`)
      - traefik.http.routers.www-http.entrypoints=web
      - traefik.http.routers.www-http.middlewares=redirect-to-https,redirect-www-to-apex

      - traefik.http.routers.www-https.rule=Host(`www.theindex.training`)
      - traefik.http.routers.www-https.entrypoints=websecure
      - traefik.http.routers.www-https.tls.certresolver=le
      - traefik.http.routers.www-https.middlewares=redirect-www-to-apex

      # Dummy service for the www routers (Traefik requires a service; it won't be used because of redirect)
      - traefik.http.services.noop.loadbalancer.server.port=65535
      - traefik.http.routers.www-http.service=noop
      - traefik.http.routers.www-https.service=noop
    restart: unless-stopped
    networks:
      - web
      - internal

  db:
    image: postgres:16-alpine
    container_name: theindex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - theindex_pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    image: ${API_IMAGE}
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${API_PORT}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=${LOG_LEVEL}
      - MEDIA_STORAGE_DIR=/data/media
      - MEDIA_PUBLIC_URL=https://media.theindex.training
      # Private media (the lesson-plan PDFs workouts are imported from): only the API reads it.
      # Never mount theindex_media_private into `media` or any other web server.
      - MEDIA_PRIVATE_STORAGE_DIR=/data/media-private
    volumes:
      - theindex_media:/data/media
      - theindex_media_private:/data/media-private
    labels:
      - traefik.enable=true

      # HTTPS: /api -> API container
      - traefik.http.routers.api.rule=Host(`app.theindex.training`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.priority=100
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=3000

      # HTTP: redirect to HTTPS
      - traefik.http.routers.api-http.rule=Host(`app.theindex.training`) && PathPrefix(`/api`)
      - traefik.http.routers.api-http.entrypoints=web
      - traefik.http.routers.api-http.priority=100
      - traefik.http.routers.api-http.middlewares=redirect-to-https

      - traefik.docker.network=theindex_internal
    restart: unless-stopped
    networks:
      - internal

  front:
    image: ${FRONT_IMAGE}
    labels:
      - traefik.enable=true

      # HTTPS: the portal (everything but /api) -> front container
      - traefik.http.routers.front.rule=Host(`app.theindex.training`) && !PathPrefix(`/api`)
      - traefik.http.routers.front.entrypoints=websecure
      - traefik.http.routers.front.priority=10
      - traefik.http.routers.front.tls.certresolver=le
      - traefik.http.services.front.loadbalancer.server.port=80

      # HTTP: redirect to HTTPS
      - traefik.http.routers.front-http.rule=Host(`app.theindex.training`) && !PathPrefix(`/api`)
      - traefik.http.routers.front-http.entrypoints=web
      - traefik.http.routers.front-http.priority=10
      - traefik.http.routers.front-http.middlewares=redirect-to-https

      - traefik.docker.network=theindex_internal
    restart: unless-stopped
    networks:
      - internal

  web:
    image: ${WEB_IMAGE}
    environment:
      - API_INTERNAL_URL=http://api:3000/api
      - SITE_URL=https://theindex.training
      - APP_URL=https://app.theindex.training
    labels:
      - traefik.enable=true

      # HTTPS: theindex.training -> public site (Astro server)
      - traefik.http.routers.web.rule=Host(`theindex.training`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=4321

      # HTTP: redirect to HTTPS
      - traefik.http.routers.web-http.rule=Host(`theindex.training`)
      - traefik.http.routers.web-http.entrypoints=web
      - traefik.http.routers.web-http.middlewares=redirect-to-https

      - traefik.docker.network=theindex_internal
    restart: unless-stopped
    networks:
      - internal

  media:
    image: nginx:alpine
    volumes:
      - theindex_media:/srv/media:ro
      - ./media/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true

      # HTTPS: media.theindex.training -> media container (read-only image files)
      - traefik.http.routers.media.rule=Host(`media.theindex.training`)
      - traefik.http.routers.media.entrypoints=websecure
      - traefik.http.routers.media.tls.certresolver=le
      - traefik.http.services.media.loadbalancer.server.port=80

      # HTTP: redirect to HTTPS
      - traefik.http.routers.media-http.rule=Host(`media.theindex.training`)
      - traefik.http.routers.media-http.entrypoints=web
      - traefik.http.routers.media-http.middlewares=redirect-to-https

      - traefik.docker.network=theindex_internal
    restart: unless-stopped
    networks:
      - internal

networks:
  web:
    name: theindex_web
  internal:
    name: theindex_internal

volumes:
  theindex_pgdata:
  # Public media (article images), served read-only by `media` at media.theindex.training.
  theindex_media:
  # Private media (workout PDFs, CrossFit's copyrighted lesson plans): mounted in `api` only.
  theindex_media_private:
