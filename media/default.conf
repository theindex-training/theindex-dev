server {
  listen 80;
  server_name _;
  root /srv/media;
  autoindex off;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;

  location = / { return 404; }

  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }
}
